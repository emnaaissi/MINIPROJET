<div class="card card-elegant card-hover h-100">
  <div class="img-wrap">
    <img [src]="instrument().photo" class="card-img-top" [alt]="instrument().nom">
  </div>
  <div class="card-body">
    <h5 class="card-title">{{ instrument().nom }}</h5>
    <p class="prix mb-2">{{ instrument().prix }} DT</p>
    <span class="badge"
          [class.badge-inclus]="instrument().solfegeInclus"
          [class.badge-neutre]="!instrument().solfegeInclus">
      {{ instrument().solfegeInclus ? 'Solfège en option' : 'Sans solfège' }}
    </span>
  </div>
  <div class="card-footer pb-3">
    <a class="btn btn-outline-bordeaux w-100" [routerLink]="['/instruments', instrument().id]">
      Voir le détail
    </a>
  </div>
</div>
