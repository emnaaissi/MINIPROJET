<header class="page-header text-center">
  <p class="eyebrow-dark">Nos cours</p>
  <h1>Choisissez votre instrument</h1>
  <div class="filet"></div>
</header>

<div class="card card-elegant mb-4">
  <div class="card-body">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label">Nom commençant par</label>
        <input type="text" class="form-control" placeholder="ex : P" #nomInput
               (input)="nomRecherche.set(nomInput.value)">
      </div>
      <div class="col-md-4">
        <label class="form-label">Prix mensuel maximum (DT)</label>
        <input type="number" class="form-control" placeholder="ex : 80" #prixInput
               (input)="prixMax.set(prixInput.value)">
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-outline-bordeaux w-100" (click)="onReset(nomInput, prixInput)">
          Réinitialiser
        </button>
      </div>
    </div>
  </div>
</div>

<div class="row g-4">
  @for (i of resultats(); track i.id) {
    <div class="col-sm-6 col-lg-4">
      <app-instrument-card [instrument]="i" />
    </div>
  } @empty {
    <div class="col-12">
      <div class="alert alert-elegant">Aucun cours ne correspond à votre recherche.</div>
    </div>
  }
</div>
